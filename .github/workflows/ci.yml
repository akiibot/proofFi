name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prooffi_test
          POSTGRES_PASSWORD: isolated-ci-postgres-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prooffi_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PROOFFI_TEST_POSTGRES_URL: postgresql+psycopg://prooffi_test:isolated-ci-postgres-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked
      - run: .venv/bin/python -m pytest services/api/postgres_tests -q
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap.py
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build:extension
      - run: npm run lint:extension
      - run: npm run test:extension
      - run: npm run test:installed -w @prooffi/extension
      - name: Reject contract drift
        run: git diff --exit-code -- contracts/ apps/web/src/lib/schema.d.ts
      - name: Reject migration drift
        run: .venv/bin/python -m alembic check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Preserve browser failure traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: apps/web/test-results/
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bootstrap.py
      - run: npx playwright install chromium
      - run: npm run check
      - run: npm run build:extension
      - run: npm run lint:extension
      - run: npm run test:extension
      - run: npm run test:installed -w @prooffi/extension
      - name: Reject contract drift
        run: git diff --exit-code -- contracts/ apps/web/src/lib/schema.d.ts
      - name: Reject migration drift
        run: .venv/Scripts/python -m alembic check
      - name: Dependency audit
        run: npm audit --audit-level=high
