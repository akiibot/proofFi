# Disposable preview only. No disk, wallet key, automatic policy, or transfers.
services:
  - type: web
    name: prooffi-preview-api
    runtime: python
    plan: free
    buildCommand: pip install uv==0.13.1 && uv sync --locked --no-dev
    startCommand: uv run --no-sync python scripts/render_preview.py
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: UV_VERSION
        value: 0.13.1
      - key: DATABASE_URL
        value: sqlite:////tmp/prooffi-preview.db
      - key: DEPLOYMENT_MODE
        value: public
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: EXECUTION_ENABLED
        value: "false"
      - key: TRUSTED_ORIGINS
        sync: false
      - key: DEMO_PASSWORD_HASH
        sync: false
